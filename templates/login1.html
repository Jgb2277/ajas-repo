<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login1.css') }}">
</head>
<body>

<div class="container">
    <div class="left">
        <h1>Welcome Back</h1>

        <form method="POST" action="{{ url_for('login_validation') }}">
            <input type="email" name="email" placeholder="Write your e-mail" required>
            <input type="password" name="password" placeholder="Password" required>
            <button class="login-btn">Login</button>
        </form>

        <div class="divider">Or</div>

        <p class="signup-text">
            Don’t have an account?
            <a href="{{ url_for('signup') }}" class="signup-link">Sign Up</a>
        </p>
    </div>

    <div class="right"></div>
</div>

</body>
</html>
